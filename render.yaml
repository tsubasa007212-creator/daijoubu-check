services:
  - type: web
    name: daijoubu-check
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node src/server.mjs
    healthCheckPath: /api/cards
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STATE_SECRET
        generateValue: true
      - key: QUESTION_URL
        sync: false
      - key: QUESTION_TOKEN
        sync: false
      - key: LIMIT_HOUR
        value: "20"
      - key: LIMIT_DAY
        value: "300"
