<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大丈夫チェック</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <p data-t="howto"></p>
  </div>
  <select id="lang" aria-label="Language">
    <option value="ja">日本語</option>
    <option value="en">English</option>
  </select>
</header>
<p class="notice"><span data-t="notice"></span><span data-t="notice2"></span><span id="draft" data-t="draft" hidden></span></p>
<main>
  <section class="talk">
    <div id="log" aria-live="polite"></div>
    <div id="topics"></div>
    <div id="examples"></div>
    <div id="quick"></div>
    <details id="check">
      <summary data-t="checkTitle"></summary>
      <p class="hint" data-t="checkHint"></p>
      <div id="check-list"></div>
      <button type="button" id="check-send" data-t="checkSend" disabled></button>
    </details>
    <form id="form">
      <textarea id="input" rows="3" maxlength="1000"></textarea>
      <div class="actions">
        <button type="submit" id="send" data-t="send"></button>
        <button type="button" id="restart" class="plain" data-t="restart"></button>
      </div>
    </form>
  </section>
  <aside class="ledger">
    <h2 data-t="ledger"></h2>
    <div id="ledger"></div>
    <section id="next" hidden>
      <h2 data-t="nextTitle"></h2>
      <p id="next-how"></p>
      <p id="next-source" class="hint"></p>
      <p id="next-needs" class="hint"></p>
      <p id="next-limit" class="hint"></p>
    </section>
    <div id="player"></div>
    <details id="repair" hidden>
      <summary data-t="repair"></summary>
      <div id="repair-list"></div>
    </details>
    <details id="sheet">
      <summary data-t="sheet"></summary>
      <label><span data-t="when"></span><input id="f-when"></label>
      <label><span data-t="what"></span><input id="f-what"></label>
      <label><span data-t="where"></span><select id="f-where"></select></label>
      <label><span data-t="trouble"></span><textarea id="f-trouble" rows="3"></textarea></label>
      <button type="button" id="copy" data-t="make"></button>
      <textarea id="sheet-text" rows="6" readonly hidden></textarea>
      <p class="hint" data-t="sheetHint"></p>
    </details>
  </aside>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
