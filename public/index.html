<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二輪問診</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="row1">
    <h1 data-t="title"></h1>
    <span class="verified"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5a4 4 0 0 0 4.9 4.9L21 13l-2.5 2.5-1.6-1.6a4 4 0 0 0-4.9-4.9L10.4 7.4l2.5-2.5zM3 21l7.6-7.6"/></svg><span data-t="verified"></span></span>
    <select id="lang" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>
  <p id="bike-chosen" class="bike" hidden></p>
</header>
<main>
  <section class="talk">
    <div id="lead-block">
      <p data-t="lead"></p>
      <p class="scope" data-t="scope"></p>
      <p data-t="howto"></p>
      <p class="notice"><span data-t="notice"></span><span data-t="notice2"></span><span id="draft" data-t="draft" hidden></span></p>
    </div>
    <div id="log"></div>
    <p id="announce" class="sr" aria-live="polite"></p>
    <div id="bike"><p data-t="bikeAsk"></p><div id="bike-list"></div></div>
    <div id="topics"></div>
    <div id="examples"></div>
    <div id="quick"></div>
    <details id="check">
      <summary data-t="checkTitle"></summary>
      <p class="hint" data-t="checkHint"></p>
      <div id="check-list"></div>
      <button type="button" id="check-send" data-t="checkSend" disabled></button>
    </details>
  </section>
  <aside class="ledger">
    <section id="next" hidden>
      <p class="step" data-t="nextTitle"></p>
      <p id="next-how"></p>
      <p id="next-source" class="hint"></p>
      <p id="next-needs"></p>
      <details><summary data-t="cannotTell"></summary><p id="next-limit"></p></details>
    </section>
    <p class="step" data-t="ledger"></p>
    <div id="ledger"></div>
    <div id="player"></div>
    <details id="repair" hidden>
      <summary data-t="repair"></summary>
      <div id="repair-list"></div>
    </details>
    <details id="sheet">
      <summary data-t="sheet"></summary>
      <label><span data-t="when"></span><input id="f-when"></label>
      <label><span data-t="what"></span><input id="f-what"></label>
      <label><span data-t="where"></span><select id="f-where"></select></label>
      <label><span data-t="trouble"></span><textarea id="f-trouble" rows="3"></textarea></label>
      <button type="button" id="copy" data-t="make"></button>
      <textarea id="sheet-text" rows="6" readonly hidden></textarea>
      <p class="hint" data-t="sheetHint"></p>
    </details>
    <button type="button" id="restart" class="plain" data-t="restart"></button>
  </aside>
</main>
<form id="form" class="dock">
  <div class="dock-in">
    <p id="mic-status" class="hint" aria-live="polite" hidden></p>
    <div class="input-row">
      <textarea id="input" rows="1" maxlength="1000"></textarea>
      <button type="button" id="mic" class="icon-btn" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      </button>
      <button type="submit" id="send" class="icon-btn send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </div>
</form>
<script src="app.js" type="module"></script>
</body>
</html>
